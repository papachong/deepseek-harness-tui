# Publish @ruhooai/dsh-tui to npm. This workflow is manual-only
# (workflow_dispatch): publication must always be an explicit, reviewed act.
# Unlike the full dsh family publish, this publishes ONLY the TUI package
# (@ruhooai/dsh-tui). The other packages in the repo stay under @deepseek-ai
# and are published by their own upstream release lane.
name: Release publish (dsh-tui)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack @ruhooai/dsh-tui tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # Bun builds the dsh-tui OpenTUI view layer (src/view/*.tsx → lib/view/*.js)
      # via Bun.build + @opentui/solid/bun-plugin. tsdown cannot compile Solid
      # JSX, and the @opentui FFI is Bun-only.
      - uses: oven-sh/setup-bun@v2

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build lib (tsc + tsdown)
        run: pnpm run build:lib:host

      - name: Build view (Bun.build Solid JSX)
        working-directory: packages/bundle/tui
        run: bun scripts/build-view.ts

      - name: Verify published artifacts
        working-directory: packages/bundle/tui
        run: tsx scripts/verify-published-artifacts.ts

      - name: Pack tarball
        working-directory: packages/bundle/tui
        run: pnpm pack --pack-destination "$PWD/../../dist/npm"

      - uses: actions/upload-artifact@v4
        with:
          name: ruhooai-dsh-tui-tarball
          path: packages/dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: Release-publish-tui
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install (immutable, no package scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: ruhooai-dsh-tui-tarball
          path: dist/npm

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/npm/*.tgz --access public

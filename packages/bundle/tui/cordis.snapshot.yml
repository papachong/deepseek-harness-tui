# Keyless replay includes the live cordis.yml, disables the key-requiring
# DeepSeek adapter, and inserts llm-replay to serve recorded JSONL without a
# key or network. The replay provider catalog claims the deepseek-official
# route so agentDefaultModel.currentSelection() resolves to a registered
# adapter. llm-replay reads DSH_SNAPSHOT_FILE from env at apply time.
# The command plugins (command-compact/feedback/goal) call the live LLM for
# summaries/telemetry, so they are disabled under replay; the command
# registry itself stays mounted so `ctx.commands.list` still resolves.
# Mirrors packages/examples/tui-demo/cordis.snapshot.yml.

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: llm
        name: '@deepseek-ai/dsh-llm'
        disabled: true
      - id: compaction
        name: '@deepseek-ai/dsh-compaction-basic'
        disabled: true
      - id: command-compact
        name: '@deepseek-ai/dsh-command-compact'
        disabled: true
      - id: command-feedback
        name: '@deepseek-ai/dsh-command-feedback'
        disabled: true
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash

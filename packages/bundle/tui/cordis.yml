# dsh-tui bundle composition. Mounts the agent spine with bash, the
# DeepSeek adapter (disabled under replay), the default model selection, and
# JSONL session persistence. stdout is the terminal surface — no JSON-RPC.
# Mirrors packages/examples/tui-demo/cordis.yml.

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 40
    maxTitleBytes: 80

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# @-mention file discovery: the host capability backing `@path` autocomplete
# in the prompt (packages/context/file-reference-local). Its pre-step listener
# enriches @-mentions in user messages with file context for the model.
- id: file-reference-local
  name: '@deepseek-ai/dsh-file-reference-local'

# @-mention session discovery: the resolver that enriches
# `@[label](dsh-session:…)` mentions with cross-session context for the model
# (packages/context/session-reference). It injects ['sessionQuery'], satisfied
# by the in-memory session-query engine below — `openAt: never` keeps SQLite
# unopened (no search) while ctx.sessionQuery stays mounted for exact reads.
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never

- id: session-reference
  name: '@deepseek-ai/dsh-session-reference'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'You are a helpful coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

# ── slash-command surface ───────────────────────────────────────────────
# The command registry + the plugins that register `/compact`, `/feedback`,
# `/goal`, `/plan` with it. The runner's onSubmit hands any `/cmd` it does
# not own (theme/model/mode/sessions/exit) to `ctx.commands.execute(agent,
# line)` so one dispatch serves all of these. Each command plugin injects
# ['commands', …]; the registry is the leaf consumer. The non-command
# services these depend on (token-meter, compaction, goal, plan-mode) mount
# beside them.
#
# `/permission` (dsh-permission-presets) is NOT mounted here: it requires a
# confining `ctx.shell` executor (sandboxMode), and this bundle mounts the
# unconfined `dsh-bash-local`. Adopting the sandbox stack (sandbox +
# sandbox-policy + bash-sandbox) is a separate composition change deferred
# to a later stage.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: commands
  name: '@deepseek-ai/dsh-commands'

- id: compaction
  name: '@deepseek-ai/dsh-compaction-basic'

- id: compaction-tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'

- id: command-feedback
  name: '@deepseek-ai/dsh-command-feedback'

- id: goal
  name: '@deepseek-ai/dsh-goal'

- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
  config:
    section: |
      You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. Do not edit or write files, run formatters, commit, or otherwise carry out the plan. Explore first with non-mutating reads, searches, and checks. When ready, call exit_plan_mode with the complete plan markdown starting with a # title. If review rejects it, incorporate the feedback and present again.

# ── work modes (agent presets) ─────────────────────────────────────────
# The preset roster. The four shipped presets (standard/code/minimal/cordis)
# map to the Tab-cyclable work modes; their display names live in
# view/modes.ts. The runner resolves the shipped preset directory from its
# own module URL (the `!!js` eval scope has no `import.meta`) and injects it
# as an overlay `roots` patch before boot — mirroring apps/cli/src/profile-boot.ts.
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: standard
    includeUserRoot: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
